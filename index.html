<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Roar | Bar & Restaurant</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #242424 0%, #111 45%, #070707 100%);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.page {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: auto;
    padding: 25px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* LOGO */

.logo {
    width: 185px;
    max-width: 60%;
    height: auto;
    margin: 10px 0 32px;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,.45));
}

/* SCREENS */

.screen {
    width: 100%;
}

.hidden {
    display: none;
}

/* MAIN MENU CARDS */

.menu-card {
    width: 100%;
    min-height: 118px;

    background: linear-gradient(145deg, #1d1d1d, #121212);
    border: 1px solid #383838;
    border-radius: 18px;

    margin-bottom: 18px;
    padding: 22px;

    display: flex;
    align-items: center;

    text-decoration: none;
    color: white;

    box-shadow: 0 12px 30px rgba(0,0,0,.25);

    cursor: pointer;
}

.menu-card:active {
    transform: scale(.98);
    border-color: #e31b23;
}

.icon {
    width: 68px;
    height: 68px;
    min-width: 68px;

    background: #e31b23;
    border-radius: 17px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 32px;
    margin-right: 20px;
}

.card-text {
    flex: 1;
}

.card-title {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 1px;
}

.card-description {
    color: #999;
    margin-top: 7px;
    font-size: 14px;
}

.arrow {
    color: #e31b23;
    font-size: 30px;
    font-weight: bold;
}

/* LANGUAGE SCREEN */

.back {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    color: #aaa;
    font-size: 14px;

    margin-bottom: 25px;

    cursor: pointer;
}

.back-arrow {
    color: #e31b23;
    font-size: 23px;
}

.language-header {
    text-align: center;
    margin-bottom: 25px;
}

.language-icon {
    font-size: 38px;
    margin-bottom: 10px;
}

.language-header h2 {
    font-size: 26px;
    margin-bottom: 7px;
}

.language-header p {
    color: #888;
    font-size: 14px;
}

/* LANGUAGE BUTTON */

.language {
    width: 100%;

    background: linear-gradient(145deg, #1d1d1d, #121212);
    border: 1px solid #333;
    border-radius: 14px;

    padding: 17px 19px;
    margin-bottom: 11px;

    display: flex;
    align-items: center;

    color: white;
    text-decoration: none;

    cursor: pointer;
}

.language:active {
    transform: scale(.98);
    border-color: #e31b23;
}

.flag {
    font-size: 28px;
    width: 48px;
}

.language-name {
    flex: 1;
    font-size: 17px;
    font-weight: 600;
}

.language-arrow {
    color: #e31b23;
    font-size: 25px;
}

/* FOOTER */

.footer {
    margin-top: auto;
    padding-top: 25px;

    color: #555;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* POPUP */

#notice {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.85);
    backdrop-filter: blur(8px);

    display: none;
    justify-content: center;
    align-items: center;

    padding: 25px;
    z-index: 100;
}

.notice-box {
    width: 100%;
    max-width: 350px;

    background: #171717;
    border: 1px solid #333;
    border-radius: 20px;

    padding: 35px 25px;
    text-align: center;
}

.notice-icon {
    font-size: 42px;
    margin-bottom: 15px;
}

.notice-box h2 {
    margin-bottom: 10px;
}

.notice-box p {
    color: #999;
    margin-bottom: 25px;
    line-height: 1.5;
}

.close {
    width: 100%;
    border: 0;

    background: #e31b23;
    color: white;

    padding: 14px;

    border-radius: 11px;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

</style>
</head>

<body>

<div class="page">

    <!-- LOGO -->

    <img src="logo.png"
         class="logo"
         alt="The Roar Bar & Restaurant">


    <!-- MAIN SCREEN -->

    <div id="mainScreen" class="screen">

        <div class="menu-card"
             onclick="openLanguages('food')">

            <div class="icon">🍽️</div>

            <div class="card-text">
                <div class="card-title">
                    FOOD MENU
                </div>

                <div class="card-description">
                    Restaurant Menu
                </div>
            </div>

            <div class="arrow">›</div>

        </div>


        <div class="menu-card"
             onclick="openLanguages('bar')">

            <div class="icon">🍸</div>

            <div class="card-text">
                <div class="card-title">
                    BAR MENU
                </div>

                <div class="card-description">
                    Drinks & Cocktails
                </div>
            </div>

            <div class="arrow">›</div>

        </div>

    </div>


    <!-- LANGUAGE SCREEN -->

    <div id="languageScreen"
         class="screen hidden">

        <div class="back"
             onclick="goBack()">

            <span class="back-arrow">‹</span>
            BACK

        </div>


        <div class="language-header">

            <div id="menuIcon"
                 class="language-icon">
                🍽️
            </div>

            <h2 id="menuTitle">
                Food Menu
            </h2>

            <p>
                Choose your language
            </p>

        </div>


        <!-- RUSSIAN -->

        <div class="language"
             onclick="openMenu('ru')">

            <div class="flag">🇷🇺</div>

            <div class="language-name">
                Русский
            </div>

            <div class="language-arrow">›</div>

        </div>


        <!-- ENGLISH -->

        <div class="language"
             onclick="openMenu('en')">

            <div class="flag">🇬🇧</div>

            <div class="language-name">
                English
            </div>

            <div class="language-arrow">›</div>

        </div>


        <!-- VIETNAMESE -->

        <div class="language"
             onclick="openMenu('vi')">

            <div class="flag">🇻🇳</div>

            <div class="language-name">
                Tiếng Việt
            </div>

            <div class="language-arrow">›</div>

        </div>


        <!-- KOREAN -->

        <div class="language"
             onclick="openMenu('ko')">

            <div class="flag">🇰🇷</div>

            <div class="language-name">
                한국어
            </div>

            <div class="language-arrow">›</div>

        </div>


        <!-- CHINESE -->

        <div class="language"
             onclick="openMenu('zh')">

            <div class="flag">🇨🇳</div>

            <div class="language-name">
                中文
            </div>

            <div class="language-arrow">›</div>

        </div>

    </div>


    <div class="footer">
        THE ROAR • BAR & RESTAURANT
    </div>

</div>


<!-- COMING SOON -->

<div id="notice"
     onclick="closeNotice()">

    <div class="notice-box"
         onclick="event.stopPropagation()">

        <div class="notice-icon">
            🦁
        </div>

        <h2>Coming Soon</h2>

        <p>
            This menu will be available soon.
        </p>

        <button class="close"
                onclick="closeNotice()">
            CLOSE
        </button>

    </div>

</div>


<script>

let selectedMenu = "";


/* OPEN LANGUAGE SELECTION */

function openLanguages(type) {

    selectedMenu = type;

    document
        .getElementById("mainScreen")
        .classList.add("hidden");

    document
        .getElementById("languageScreen")
        .classList.remove("hidden");


    if (type === "food") {

        document.getElementById("menuIcon")
            .innerText = "🍽️";

        document.getElementById("menuTitle")
            .innerText = "Food Menu";

    }

    if (type === "bar") {

        document.getElementById("menuIcon")
            .innerText = "🍸";

        document.getElementById("menuTitle")
            .innerText = "Bar Menu";

    }

}


/* BACK */

function goBack() {

    document
        .getElementById("languageScreen")
        .classList.add("hidden");

    document
        .getElementById("mainScreen")
        .classList.remove("hidden");

}


/* MENU LINKS */

function openMenu(language) {

    // BAR MENU — ENGLISH
    if (selectedMenu === "bar" && language === "en") {
        window.location.href = "bar-en.pdf";
        return;
    }

    // ALL OTHER MENUS — COMING SOON
    document.getElementById("notice")
        .style.display = "flex";
}
    
    /*
    ПОЗЖЕ СЮДА ДОБАВИМ ССЫЛКИ:

    Например:

    if (selectedMenu === "food" && language === "ru") {
        window.location.href = "ССЫЛКА";
        return;
    }

    if (selectedMenu === "bar" && language === "en") {
        window.location.href = "ССЫЛКА";
        return;
    }

    */

    document.getElementById("notice")
        .style.display = "flex";

}


/* CLOSE POPUP */

function closeNotice() {

    document.getElementById("notice")
        .style.display = "none";

}

</script>

</body>
</html>
