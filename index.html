<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Menu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            margin-bottom: 8px;
        }

        p {
            color: #aaa;
            margin-bottom: 30px;
        }

        .language {
            display: block;
            width: 100%;
            padding: 18px;
            margin: 12px 0;

            background: #222;
            color: white;

            text-decoration: none;
            font-size: 19px;

            border: 1px solid #444;
            border-radius: 12px;
        }

        .language:hover {
            background: #333;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>MENU</h1>

    <p>Choose your language</p>

    <a class="language"
       href="ССЫЛКА_НА_РУССКИЙ_PDF">
        🇷🇺 Русский
    </a>

    <a class="language"
       href="ССЫЛКА_НА_АНГЛИЙСКИЙ_PDF">
        🇬🇧 English
    </a>

    <a class="language"
       href="ССЫЛКА_НА_ВЬЕТНАМСКИЙ_PDF">
        🇻🇳 Tiếng Việt
    </a>

    <a class="language"
       href="ССЫЛКА_НА_КОРЕЙСКИЙ_PDF">
        🇰🇷 한국어
    </a>

    <a class="language"
       href="ССЫЛКА_НА_КИТАЙСКИЙ_PDF">
        🇨🇳 中文
    </a>

</div>

</body>
</html>
